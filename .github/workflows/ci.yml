name: Kiln CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Mac ---
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja flatbuffers

      # --- Linux ---
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build flatbuffers-compiler

      # --- Windows ---
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja
          curl -L -o flatc.zip "https://github.com/google/flatbuffers/releases/download/v25.12.19/Windows.flatc.binary.zip"
          unzip -j flatc.zip flatc.exe -d $RUNNER_TEMP/flatc_bin
          echo "$RUNNER_TEMP/flatc_bin" >> $GITHUB_PATH

      - name: Configure CMake
        shell: bash
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --preset kiln

      - name: Build Project
        shell: bash
        run: |
          export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          cmake --build cmake-build-debug

      - name: Run Binary Serialization Test
        shell: bash
        run: |
          echo "=== ゼロコピー読み込み検証を開始します ==="
          if [ "$RUNNER_OS" == "Windows" ]; then
             ./cmake-build-debug/bin/kiln_tests.exe
          else
             ./cmake-build-debug/bin/kiln_tests
          fi